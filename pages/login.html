<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Baytna</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <div data-include="/pages/partials/navbar.html"></div>

  <main class="container">
    <section class="auth-page">
      <div class="auth-card">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to order from your favorite home cooks.</p>

        <form class="auth-form" id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input class="input" type="email" id="login-email" name="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input class="input" type="password" id="login-password" name="password" autocomplete="current-password" required>
          </div>

          <a href="#" class="auth-forgot-link">Forgot Password?</a>

          <p class="error-text" id="login-error" aria-live="polite"></p>

          <button type="submit" class="btn-primary">Log In</button>
        </form>

        <p class="auth-footer">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
      </div>
    </section>
  </main>

  <div data-include="/pages/partials/footer.html"></div>

  <script src="/js/include.js" defer></script>
  <script src="/js/customer.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const submitButton = form.querySelector('button[type="submit"]');
    const loginError = document.getElementById('login-error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      loginError.textContent = '';
      if (form.checkValidity()) {
        submitButton.disabled = true;
        submitButton.textContent = 'Signing in…';

        try {
          await window.BaytnaCustomer.login(form.email.value.trim(), form.password.value);
          window.location.assign('/pages/stores.html');
        } catch (error) {
          loginError.textContent = error.message || 'Unable to sign in.';
          submitButton.disabled = false;
          submitButton.textContent = 'Log In';
        }
      } else {
        form.reportValidity();
      }
    });
  </script>

</body>
</html>
