<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Baytna</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <div data-include="/pages/partials/navbar.html"></div>

  <main class="container">
    <section class="confirmation-page">

      <svg class="confirmation-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="11" fill="var(--primary-soft)"/>
        <path d="M7 12.5l3.2 3.2L17 9" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <h1 class="confirmation-title">Thank you, your order is on its way to being made!</h1>
      <p class="confirmation-subtitle">
        We've sent your order to the cook. You'll get a notification as soon
        as it's out for delivery.
      </p>

      <div class="confirmation-details">
        <div class="confirmation-detail-row">
          <span class="confirmation-detail-label">Order Number</span>
          <span class="confirmation-detail-value">#10428</span>
        </div>
        <div class="confirmation-detail-row">
          <span class="confirmation-detail-label">Status</span>
          <span class="badge">Preparing</span>
        </div>
        <div class="confirmation-detail-row">
          <span class="confirmation-detail-label">Estimated Delivery</span>
          <span class="confirmation-detail-value">40 minutes</span>
        </div>
      </div>

      <div class="confirmation-actions">
        <a href="dishes.html" class="btn-primary">Continue Shopping</a>
      </div>

    </section>
  </main>

  <div data-include="/pages/partials/footer.html"></div>

  <script src="/js/include.js" defer></script>
  <script src="/js/customer.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('orderId');
      const orderNumberEl = document.querySelector('.confirmation-detail-value');
      const statusEl = document.querySelector('.confirmation-details .badge');
      const deliveryEl = document.querySelectorAll('.confirmation-detail-value')[1];

      if (!orderId) return;

      window.BaytnaCustomer.request(`/orders/${encodeURIComponent(orderId)}`)
        .then((order) => {
          orderNumberEl.textContent = `#${order.order_number ?? order.orderNumber ?? order.id}`;
          statusEl.textContent = order.status ? order.status[0].toUpperCase() + order.status.slice(1) : 'Preparing';
          if (deliveryEl) {
            deliveryEl.textContent = order.estimated_delivery || '40 minutes';
          }
        })
        .catch(() => {});
    })();
  </script>

</body>
</html>
