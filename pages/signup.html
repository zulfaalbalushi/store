<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Baytna</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

  <div data-include="/pages/partials/navbar.html"></div>

  <main class="container">
    <section class="auth-page">
      <div class="auth-card">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Join Baytna and taste homemade Omani food from real home cooks.</p>

        <form class="auth-form" id="signup-form" novalidate>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input class="input" type="email" id="signup-email" name="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input class="input" type="password" id="signup-password" name="password" autocomplete="new-password" minlength="8" required>
          </div>

          <div class="form-group">
            <label for="signup-confirm-password">Confirm Password</label>
            <input class="input" type="password" id="signup-confirm-password" name="confirmPassword" autocomplete="new-password" minlength="8" required>
            <span class="error-text" id="password-mismatch-error" hidden>Passwords do not match.</span>
          </div>

          <p class="error-text" id="signup-error" aria-live="polite"></p>

          <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="auth-footer">
          Already have an account? <a href="login.html">Log In</a>
        </p>
      </div>
    </section>
  </main>

  <div data-include="/pages/partials/footer.html"></div>

  <script src="/js/include.js" defer></script>
  <script src="/js/customer.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const email = document.getElementById('signup-email');
    const password = document.getElementById('signup-password');
    const confirmPassword = document.getElementById('signup-confirm-password');
    const mismatchError = document.getElementById('password-mismatch-error');
    const submitButton = form.querySelector('button[type="submit"]');
    const signupError = document.getElementById('signup-error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      signupError.textContent = '';
      const passwordsMatch = password.value === confirmPassword.value;
      mismatchError.hidden = passwordsMatch;

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (!passwordsMatch) {
        confirmPassword.focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Creating account…';

      try {
        await window.BaytnaCustomer.signup(email.value.trim(), password.value);
        await window.BaytnaCustomer.login(email.value.trim(), password.value);
        window.location.assign('/pages/stores.html');
      } catch (error) {
        signupError.textContent = error.message || 'Unable to create account.';
        submitButton.disabled = false;
        submitButton.textContent = 'Create Account';
      }
    });
  </script>

</body>
</html>
